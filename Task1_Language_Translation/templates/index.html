<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>AI Language Translator</title>

    <style>

        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            min-height: 100vh;

            background: linear-gradient(
                135deg,
                #667eea,
                #764ba2
            );

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 90%;
            max-width: 850px;

            background: white;

            padding: 35px;

            border-radius: 20px;

            box-shadow:
                0 15px 40px rgba(0, 0, 0, 0.2);
        }

        h1 {
            text-align: center;

            color: #333;

            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;

            color: #777;

            margin-bottom: 30px;
        }

        label {
            display: block;

            margin-bottom: 8px;

            font-weight: bold;

            color: #444;
        }

        textarea {
            width: 100%;

            height: 150px;

            padding: 15px;

            border: 1px solid #ddd;

            border-radius: 10px;

            resize: vertical;

            font-size: 16px;
        }

        .languages {
            display: flex;

            gap: 20px;

            margin-top: 20px;
        }

        .language-box {
            flex: 1;
        }

        select {
            width: 100%;

            padding: 12px;

            border-radius: 8px;

            border: 1px solid #ccc;

            font-size: 15px;

            background: white;
        }

        button {
            width: 100%;

            margin-top: 25px;

            padding: 14px;

            border: none;

            border-radius: 10px;

            background: #667eea;

            color: white;

            font-size: 17px;

            cursor: pointer;
        }

        button:hover {
            background: #5568d8;
        }

        .result {
            margin-top: 25px;

            padding: 20px;

            background: #f5f6ff;

            border-radius: 10px;

            border-left: 5px solid #667eea;
        }

        .result h3 {
            color: #667eea;

            margin-top: 0;
        }

        .result p {
            font-size: 17px;

            line-height: 1.6;

            color: #333;
        }

        .error {
            margin-top: 20px;

            color: red;

            text-align: center;

            font-weight: bold;
        }

        @media (max-width: 600px) {

            .languages {
                flex-direction: column;
            }

            .container {
                width: 95%;

                padding: 20px;
            }

        }

    </style>

</head>


<body>


<div class="container">


    <h1>🌍 AI Language Translator</h1>


    <p class="subtitle">

        Translate text between multiple languages
        using an online translation API.

    </p>


    <form method="POST">


        <!-- Text Input -->

        <label for="text">
            Enter Text
        </label>


        <textarea
            id="text"
            name="text"
            placeholder="Type your text here..."
            required
        >{{ original_text }}</textarea>


        <!-- Language Selection -->

        <div class="languages">


            <div class="language-box">

                <label for="source">
                    Source Language
                </label>


                <select
                    id="source"
                    name="source"
                >

                    {% for name, code in languages.items() %}

                    <option
                        value="{{ code }}"
                        {% if code == "en" %}
                        selected
                        {% endif %}
                    >

                        {{ name }}

                    </option>

                    {% endfor %}

                </select>

            </div>


            <div class="language-box">

                <label for="target">
                    Target Language
                </label>


                <select
                    id="target"
                    name="target"
                >

                    {% for name, code in languages.items() %}

                    <option
                        value="{{ code }}"
                        {% if code == "hi" %}
                        selected
                        {% endif %}
                    >

                        {{ name }}

                    </option>

                    {% endfor %}

                </select>

            </div>


        </div>


        <!-- Translate Button -->

        <button type="submit">

            🔄 Translate

        </button>


    </form>


    <!-- Translation Result -->

    {% if translated_text %}

    <div class="result">

        <h3>
            Translated Text
        </h3>

        <p>
            {{ translated_text }}
        </p>

    </div>

    {% endif %}


    <!-- Error Message -->

    {% if error %}

    <div class="error">

        {{ error }}

    </div>

    {% endif %}


</div>


</body>

</html>
